<style>
:root{--bg:#070F1E;--bg2:#10304A;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--ink:#F2F8FF;--mut:#A9BED0;--acc:#5EEAD4;--ball:#E8F03A;--sky:#38BDF8;--bad:#FB7185;--vio:#8B5CF6;--mag:#EC4899;--ora:#FB923C;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg)}
body{background:radial-gradient(900px 520px at 0% -5%,rgba(139,92,246,.55),transparent 60%),radial-gradient(800px 520px at 105% 0%,rgba(20,184,166,.42),transparent 60%),radial-gradient(900px 600px at 50% 112%,rgba(236,72,153,.32),transparent 60%),linear-gradient(180deg,#070F1E,#0B2038);background-attachment:scroll;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:18px 16px 8px}
h1{font-size:1.75rem;line-height:1.15;margin:6px 0 6px;letter-spacing:-.01em;background:linear-gradient(90deg,#fff,#A5F3FC 60%,#F5D0FE);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.1rem;margin:26px 0 8px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:1.1em;border-radius:4px;background:linear-gradient(180deg,var(--acc),var(--vio))}
p{margin:6px 0}
a{color:var(--acc)}
.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}
.card{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:0 8px 28px rgba(0,0,0,.25)}
a.card{display:block;color:inherit;text-decoration:none}
.btn{display:inline-block;border:0;border-radius:15px;padding:13px 18px;font:inherit;font-weight:800;background:linear-gradient(135deg,#F3FA3C,#5EEAD4);color:#06202E;text-decoration:none;cursor:pointer;text-align:center;box-shadow:0 6px 20px rgba(94,234,212,.35)}
.btn.sec{background:rgba(255,255,255,.13);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sky{background:linear-gradient(135deg,#38BDF8,#818CF8);color:#04152A;box-shadow:0 6px 20px rgba(56,189,248,.4)}
.btn.small{padding:8px 13px;font-size:.9rem;border-radius:12px}
.btn.block{display:block;width:100%;font-size:1.05rem;padding:15px}
.btn[disabled]{opacity:.4;box-shadow:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);border-radius:999px;padding:10px 15px;font:inherit;font-weight:700;min-width:46px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,#5EEAD4,#38BDF8);color:#04202E;border-color:transparent;box-shadow:0 4px 14px rgba(56,189,248,.4)}
.badge{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:800;background:rgba(255,255,255,.16)}
.badge.sky{background:rgba(56,189,248,.25);color:#7DD3FC}
.badge.ok{background:rgba(94,234,212,.25);color:#99F6E4}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5EEAD4,#38BDF8,#A78BFA);border-radius:99px}
.rung{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,color-mix(in srgb,var(--c,#888) 24%,transparent),rgba(255,255,255,.05) 70%);border:1px solid var(--line);border-left:9px solid var(--c,#888);border-radius:16px;padding:10px 10px 10px 12px;margin:8px 0;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.rung.work{outline:2px solid var(--ball);box-shadow:0 0 0 4px rgba(232,240,58,.14),0 8px 24px rgba(232,240,58,.18)}
.rung .n{font-weight:900;font-size:1.25rem;min-width:28px;color:var(--c);text-shadow:0 0 14px var(--c)}
.rung .t{flex:1;line-height:1.3}
.rung.done{--c:var(--sky);border-left-color:var(--sky)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);border-radius:8px;width:44px;height:34px;font-size:1rem;cursor:pointer}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#6D28D9 0%,#0EA5E9 58%,#14B8A6 100%);border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 14px 40px rgba(14,165,233,.35)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);pointer-events:none}
.hero.warm{background:linear-gradient(135deg,#DB2777 0%,#F97316 62%,#FACC15 100%);box-shadow:0 14px 40px rgba(249,115,22,.35)}

.hero .sit{font-size:1.4rem;font-weight:800;line-height:1.25;margin:8px 0}
.hero .mut{color:rgba(255,255,255,.85)}
.hero a{color:#fff}
.hero .badge{background:rgba(255,255,255,.25);color:#fff}
.hero .btn.sec{background:rgba(255,255,255,.22)}
.hero .btn.ghost{border-color:rgba(255,255,255,.5)}
input[type=text],input[type=time],textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:12px;padding:12px}
label.check{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
label.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--acc)}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 20px));display:flex;background:rgba(9,20,38,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#nav a{flex:1;text-align:center;text-decoration:none;color:var(--mut);padding:8px 2px;border-radius:18px;font-size:.72rem;font-weight:700}

body.running #nav{display:none}
.run{text-align:center;padding-top:6px}
.orb{width:170px;height:170px;border-radius:50%;margin:10px auto 16px;background:radial-gradient(circle at 32% 28%,#fff,#99F6E4 18%,#2DD4BF 45%,#7C3AED 100%);box-shadow:0 0 70px rgba(45,212,191,.55),0 0 140px rgba(124,58,237,.35);animation:br 8s ease-in-out infinite}

.orb.vis{background:radial-gradient(circle at 32% 28%,#fff,#FDE68A 18%,#FB923C 45%,#DB2777 100%);box-shadow:0 0 70px rgba(251,146,60,.55),0 0 140px rgba(219,39,119,.4)}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.phase{font-weight:800;color:var(--acc);margin-bottom:6px;letter-spacing:.02em}
.big{font-size:1.55rem;font-weight:800;line-height:1.3;min-height:6.2em;display:flex;align-items:center;justify-content:center;padding:0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;background:linear-gradient(135deg,#F3FA3C,#5EEAD4);color:#06202E;padding:10px 16px;border-radius:14px;font-weight:800;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.4)}
svg text{fill:var(--mut);font-size:10px}

.rung.drag{position:relative;z-index:30;transform-origin:center;box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 2px var(--acc);opacity:.96;transition:none}

<script>
(function () {
'use strict';
const KEY = 'scala_v1', MAXL = 10;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dk = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fdate = ts => { const d = new Date(ts); return d.getDate() + '/' + (d.getMonth() + 1); };
const app = $('#app');

// ---------- Dati ----------
const LIB = [
  'Match point in un torneo, giocare sciolto',
  'Servire per chiudere il set o la partita',
  'Finale di torneo',
  'Tie-break decisivo',
  'Pubblico ostile che fischia o disturba',
  'Avversario antipatico o polemico che cerca il conflitto',
  'Avversario che contesta le mie chiamate',
  'Arbitro che sbaglia chiamate importanti',
  'Avversario infortunato che continua a giocare',
  'Compagno di doppio nervoso o non centrato',
  'Dopo un errore banale su una palla facile',
  'Dopo aver sprecato un vantaggio (da 5-2 a 5-5)',
  'Secondo servizio sul 30-40',
  'Mi tremano braccio e gambe quando sono avanti',
  'Partita partita male, sono sotto 0-4',
  'Giocare davanti a persone importanti (allenatore, famiglia)',
  'Contro un avversario che devo battere per forza',
  'Prima partita dopo una brutta sconfitta',
  'Condizioni difficili: vento, sole, rumore',
  'Cambio di compagno all\'ultimo momento',
  'Giocare contro un amico o un compagno di club',
  'Riscaldamento corto o entrare in campo in ritardo'
].map((t, i) => ({ id: 'l' + i, t: t.replace('Partita partita male', 'Partita iniziata male') }));
const DEF = { sit: [], order: [], focus: null, level: 1, sessions: [], tests: [], tas: [], vis: [], auto: [], unlocked: false, cstart: null, voice: true, pace: 10, rem: '21:00' };
let S = load();
function load() { try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && typeof o === 'object') return Object.assign({}, DEF, o); } catch (e) {} return JSON.parse(JSON.stringify(DEF)); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const byId = id => S.sit.find(x => x.id === id);
const doneList = () => S.sit.filter(x => x.st === 'done').sort((a, b) => (b.sup || 0) - (a.sup || 0));
function cleanOrder() { S.order = S.order.filter(id => { const x = byId(id); return x && x.st === 'on'; }); }
function working() { cleanOrder(); if (S.focus && S.order.includes(S.focus)) return byId(S.focus); const id = S.order[S.order.length - 1]; return id ? byId(id) : null; }
function colorAt(i, n) { const t = n <= 1 ? 0.5 : i / (n - 1); return 'hsl(' + Math.round(t * 130) + ',78%,60%)'; }
function addSit(text, libId) {
  text = String(text || '').trim(); if (!text) return false;
  cleanOrder(); if (S.order.length >= MAXL) { toast('La scala ha già 10 situazioni. Superane una o rimuovila.'); return false; }
  let x = libId ? byId(libId) : null;
  if (!x) { x = { id: libId || 'c' + Date.now(), t: text, st: 'off', custom: !libId }; S.sit.push(x); }
  x.st = 'on'; S.order.unshift(x.id); save(); return true;
}
function sessionsOf(id) { return S.sessions.filter(s => s.sit === id); }
function ready(id) {
  const ss = sessionsOf(id).slice(-2); if (ss.length < 2) return false;
  return ss.every(s => Math.max.apply(null, s.cycles.map(c => c.peak)) <= 3 && s.post <= 2);
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function set(h) { app.innerHTML = h; const y = window._keepY; window._keepY = null; window.scrollTo(0, y == null ? 0 : y); }

// ---------- Training autogeno ----------
const TAG = [
  { n: 'Pesantezza', d: 'Braccia e gambe pesanti', f: ['Il braccio destro è pesante.', 'Il braccio sinistro è pesante.', 'La gamba destra è pesante.', 'La gamba sinistra è pesante.', 'Tutto il corpo è pesante e rilassato.'] },
  { n: 'Calore', d: 'Braccia e gambe calde', f: ['Il braccio destro è caldo.', 'Il braccio sinistro è caldo.', 'La gamba destra è calda.', 'La gamba sinistra è calda.', 'Tutto il corpo è caldo e rilassato.'] },
  { n: 'Cuore', d: 'Battito calmo e regolare', f: ['Il cuore batte calmo e regolare.', 'Il battito è tranquillo.'] },
  { n: 'Respiro', d: 'Respiro che si lascia respirare', f: ['Il respiro è calmo e regolare.', 'Respiro e mi lascio respirare.'] },
  { n: 'Addome', d: 'Calore al centro del corpo', f: ['L\'addome è caldo.', 'Il calore si diffonde al centro del corpo.'] },
  { n: 'Fronte', d: 'Fronte fresca, mente chiara', f: ['La fronte è fresca.', 'La mente è chiara e tranquilla.'] }
];
function buildTA(level) {
  const p = S.pace || 10; const q = [{ t: 'Mettiti comodo. Chiudi gli occhi.', s: 8 }, { t: 'Sono calmo.', s: 8 }];
  for (let g = 0; g < level; g++) { const reps = g === level - 1 ? 2 : 1; TAG[g].f.forEach(f => { for (let r = 0; r < reps; r++) q.push({ t: f, s: p }); }); }
  q.push({ t: 'Sono calmo, centrato. Il mio respiro è regolare e profondo.', s: 10 });
  return q;
}
const RIPRESA = [{ t: 'Ora riprendo. Stringo i pugni.', s: 6 }, { t: 'Piego le braccia e respiro profondo.', s: 6 }, { t: 'Apro gli occhi.', s: 5 }];
const LAYERS = {
  colori: 'Guarda i colori: il campo, le linee, la pallina, i vestiti.',
  suoni: 'Ascolta i suoni: la pallina, il pubblico, la tua voce.',
  sapori: 'Senti il sapore in bocca: l\'acqua, il sudore, la gomma della pallina.',
  respiro: 'Senti il respiro: regolare e profondo, anche dentro la scena.',
  tensione: 'Senti spalle, braccio e mano sulla racchetta: sono sciolti.'
};
const LAYER_N = { colori: 'Colori', suoni: 'Suoni', sapori: 'Sapori', respiro: 'Respiro', tensione: 'Tensione' };
function visSteps(x, layers, secs) {
  const q = [{ t: 'Immagina la scena: ' + x.t, s: 15 }];
  let tot = 15; layers.forEach(l => { q.push({ t: LAYERS[l], s: 12 }); tot += 12; });
  const rest = Math.max(0, secs - tot); if (rest > 0) q.push({ t: 'Resta nella scena. Respira regolare e profondo.', s: rest });
  return q;
}
function backSteps(peak) {
  const q = [{ t: 'Esco dalla scena. Apro la mente.', s: 7 }, { t: 'Sono calmo e centrato.', s: 8 }, { t: 'Il mio respiro è regolare e profondo.', s: 9 }, { t: 'Il corpo è pesante e caldo.', s: 8 }];
  if (peak >= 6) { q.push({ t: 'Espiro lento, più a lungo di quanto inspiro.', s: 10 }); q.push({ t: 'Sono calmo. Lascio andare la scena.', s: 10 }); }
  return q;
}
const BREATH = (() => { const q = []; for (let i = 0; i < 7; i++) { q.push({ t: 'Inspira dal naso. 3 secondi.', s: 3 }); q.push({ t: 'Espira lento. 5 secondi.', s: 5 }); } return q; })();


// ---------- Corso base ----------
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const taPassed = l => { const a = S.tas.filter(t => t.level === l); return a.length >= 4 && avg(a.slice(-3).map(t => t.rel)) >= 6; };
const visPassed = l => { const a = S.vis.filter(t => t.level === l); return a.length >= 3 && avg(a.slice(-2).map(t => t.avg)) >= 3.5; };
const lastAuto = () => S.auto[S.auto.length - 1];
function gate() {
  const ta = [1, 2, 3, 4].filter(taPassed).length, vi = [1, 2, 3, 4].filter(visPassed).length, la = lastAuto();
  return { ta, vi, au: la ? la.pct : null, ok: ta === 4 && vi === 4 && !!la && la.pct >= 60 };
}
function curV() { for (let l = 1; l <= 6; l++) if (!visPassed(l)) return l; return 6; }
const VDIMS = { nit: 'Nitidezza dell\'immagine', col: 'Colori', sui: 'Suoni', sap: 'Sapori e odori', cor: 'Sensazioni del corpo', con: 'Controllo: muovi e cambi l\'immagine', sta: 'Stabilità: non si dissolve', trd: '3D: profondità, giri la testa' };
const VLEV = [
  { n: 'Figura semplice', d: 'Una pallina gialla ferma: colore, contorno, cuciture.', dims: ['nit', 'sta'], steps: [
    ['Mettiti comodo. Chiudi gli occhi. Respira calmo.', 7], ['Davanti a te c\'è una pallina da tennis gialla, ferma, sospesa nell\'aria.', 14], ['Guarda il colore giallo. Guarda il contorno rotondo.', 14], ['Guarda le cuciture bianche e la peluria.', 14], ['Allontana la pallina, poi avvicinala. Tienila ferma e nitida.', 16], ['Lasciala dissolvere lentamente. Apri gli occhi.', 8]] },
  { n: 'Figura in movimento', d: 'Pallina che rimbalza, racchetta in mano.', dims: ['nit', 'sta', 'con', 'cor'], steps: [
    ['Mettiti comodo. Chiudi gli occhi. Respira calmo.', 7], ['Hai la racchetta in mano. Senti il peso e il manico.', 13], ['Una pallina rimbalza piano davanti a te: giù, su, giù, su.', 15], ['Segui il rimbalzo con gli occhi, al ritmo del respiro.', 15], ['Colpisci piano la pallina. Senti la mano e il polso.', 15], ['Ferma l\'immagine. Falla ripartire. Poi apri gli occhi.', 12]] },
  { n: 'Il campo vuoto', d: 'Colori e rumori di un campo senza nessuno.', dims: ['nit', 'col', 'sui', 'sta'], steps: [
    ['Mettiti comodo. Chiudi gli occhi. Respira calmo.', 7], ['Sei sul campo vuoto. Guarda i colori della superficie e delle linee.', 14], ['Guarda la rete, il cielo, i bordi del campo.', 13], ['Ascolta il silenzio. Poi il rumore della pallina sul campo: toc.', 14], ['Ascolta il rumore delle scarpe sulla superficie.', 12], ['Ascolta lontano: il vento, qualche voce. Poi apri gli occhi.', 12]] },
  { n: 'Più sensi', d: 'Sapori, odori, temperatura e vento.', dims: ['nit', 'col', 'sui', 'sap', 'cor', 'sta'], steps: [
    ['Mettiti comodo. Chiudi gli occhi. Respira calmo.', 7], ['Senti la temperatura dell\'aria sulla pelle e il vento leggero.', 13], ['Senti l\'odore del campo: terra, gomma, erba o cemento.', 13], ['Senti il sapore dell\'acqua fresca che bevi.', 12], ['Senti il sapore di sale sulle labbra.', 12], ['Ora tutto insieme: colori, suoni, odori, sapori.', 16], ['Apri lentamente gli occhi.', 5]] },
  { n: 'In 3D', d: 'Ti muovi nel campo, giri la testa, ti vedi dall\'esterno.', dims: ['nit', 'con', 'cor', 'trd', 'sta'], steps: [
    ['Mettiti comodo. Chiudi gli occhi. Respira calmo.', 7], ['Guarda il campo davanti a te. Gira lentamente la testa a sinistra.', 13], ['Gira dietro di te: vedi recinzioni, teli e persone.', 13], ['Ora ti vedi dall\'esterno mentre palleggi: piccolo, in 3D.', 14], ['Rientra nel tuo corpo. Vedi con i tuoi occhi, senti i piedi.', 13], ['Muoviti nel campo: ogni passo ha il suo rumore.', 13], ['Apri lentamente gli occhi.', 5]] },
  { n: 'Scena realistica', d: 'Una partita normale, tranquilla, con tutti i sensi.', dims: ['nit', 'col', 'sui', 'sap', 'cor', 'con', 'sta', 'trd'], steps: [
    ['Mettiti comodo. Chiudi gli occhi. Respira calmo.', 7], ['Sei in una partita normale, punteggio basso, avversario educato.', 14], ['Guarda l\'avversario: la maglia, la posizione, i movimenti.', 13], ['Ascolta il pubblico che applaude con calma.', 12], ['Servi o rispondi: senti ogni gesto, colpisci pulito.', 15], ['Il respiro è regolare e profondo. Tutto è nitido e in 3D.', 14], ['Chiudi la scena con un respiro. Apri gli occhi.', 8]] }
];
const AUTO_Q = ['Sento le braccia pesanti entro 2 minuti.', 'Sento calore alle mani.', 'Il respiro diventa regolare senza sforzo.', 'Il battito rallenta quando lo voglio.', 'Resto rilassato senza addormentarmi né distrarmi.', 'Mi calmo in meno di 2 minuti anche fuori casa.', 'Rilassa spalle e mani durante la giornata.', 'Dopo l\'esercizio mi sento più sciolto di prima.'];
const PLAN = [['1', 'Livello 1 Pesantezza', 'Livello 1 Figura semplice'], ['2', 'Livello 2 Calore', 'Livello 2 In movimento'], ['3', 'Livello 3 Cuore', 'Livello 3 Campo vuoto'], ['4', 'Livello 4 Respiro', 'Livello 4 Più sensi · via libera'], ['5', 'Livello 5 Addome', 'Livello 5 In 3D'], ['6', 'Livello 6 Fronte', 'Livello 6 Scena realistica']];

// ---------- Motore sessione ----------
let ses = null, tickId = null, wl = null;
function speak(t) { if (!S.voice || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'it-IT'; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {} }
async function wakeOn() { try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
function wakeOff() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
function startTick() { stopTick(); tickId = setInterval(tick, 200); }
function stopTick() { if (tickId) clearInterval(tickId); tickId = null; }
function startTimed(steps, done) {
  ses.q = steps; ses.qi = 0; ses.doneCb = done; ses.paused = false;
  ses.cum = []; let a = 0; steps.forEach(s => { ses.cum.push(a); a += s.s * 1000; }); ses.total = a;
  setStep(); render(); startTick();
}
function setStep() { const st = ses.q[ses.qi]; ses.dur = st.s * 1000; ses.tEnd = Date.now() + ses.dur; speak(st.t); }
function tick() {
  if (!ses || !ses.q || ses.paused) return;
  const now = Date.now();
  if (now >= ses.tEnd) {
    ses.qi++;
    if (ses.qi >= ses.q.length) { stopTick(); const d = ses.doneCb; ses.q = null; d(); return; }
    setStep(); const e = $('#rt'); if (e) e.textContent = ses.q[ses.qi].t;
  }
  const left = Math.max(0, ses.tEnd - now), el = ses.cum[ses.qi] + (ses.dur - left);
  const p = $('#rp'); if (p) p.style.width = Math.min(100, 100 * el / ses.total) + '%';
  const s = $('#rs'); if (s) s.textContent = Math.ceil((ses.total - el) / 1000) + ' s alla fine di questa fase';
}
function abort() { stopTick(); try { speechSynthesis.cancel(); } catch (e) {} wakeOff(); ses = null; document.body.classList.remove('running'); }
function render() { route(true); }

// ---------- Viste ----------
const view = {};
view.scala = function () {
  cleanOrder(); const n = S.order.length, w = working(), dn = doneList();
  let h = '<h1>Scala della calma</h1><p class="mut">Un gradino alla volta: si parte dalla situazione più morbida (l’ultima) e si sale fino alla 1.</p>';
  if (!n && !dn.length) {
    h += '<div class="card"><h2 style="margin-top:0">Costruisci la tua scala</h2><p>Scegli da 5 a 10 situazioni che ti fanno perdere il controllo in partita. Poi le metti in ordine: 1 la più difficile, 10 la più abbordabile.</p><a class="btn" href="#/scelta">Scegli le situazioni</a></div>';
    h += pathCard(); set(h); return;
  }
  h += pathCard();
  if (w) {
    const pos = S.order.indexOf(w.id) + 1, ss = sessionsOf(w.id), last = ss[ss.length - 1], rd = ready(w.id);
    h += `<div class="hero"><div class="row spread"><span class="badge">Posizione ${pos} di ${n}</span>${rd ? '<span class="badge ok">Pronta da superare</span>' : ''}</div>
      <div class="sit">${esc(w.t)}</div>
      <p class="mut">${ss.length ? 'Esercizi fatti: ' + ss.length + (last ? ' · ultimo picco di agitazione ' + Math.max.apply(null, last.cycles.map(c => c.peak)) + '/10' : '') : 'Ancora nessun esercizio su questa situazione.'}</p>
      ${S.unlocked ? '' : '<p class="mut" style="margin:6px 0">Prima completa il <a href="#/corso">corso base</a>. Intanto prepara la lista.</p>'}<div class="row" style="margin-top:10px"><a class="btn" href="${S.unlocked ? '#/sessione' : '#/corso'}">${S.unlocked ? 'Inizia l\'esercizio' : 'Vai al corso base'}</a>
      <button class="btn ${rd ? 'sky' : 'sec'}" data-act="sup">Superata ✓</button>
      <a class="btn sec" href="#/test">Provata in partita</a></div>
      ${rd ? '<p class="mut" style="margin-top:8px">Gli ultimi 2 esercizi sono andati bene (picco 3 o meno, fine 2 o meno). Se in partita ti senti tranquillo, segnala come superata.</p>' : '<p class="mut" style="margin-top:8px">Si considera pronta dopo 2 esercizi di fila con picco 3 o meno e agitazione finale 2 o meno.</p>'}</div>`;
  } else h += '<div class="card"><b>Scala completata 🎉</b><p class="mut">Hai superato tutte le situazioni. Aggiungine di nuove quando vuoi.</p></div>';
  h += '<div class="row spread"><h2 style="margin:18px 0 4px">La mia scala</h2><a class="btn small sec" href="#/scelta">+ Situazioni</a></div><p class="mut" style="margin:0 0 6px">1 è la più difficile, ' + (n || 10) + ' la più morbida. Tieni premuta una riga e trascinala su o giù. Oppure tocca il numero, o usa le frecce.</p>';
  S.order.forEach((id, i) => {
    const x = byId(id), c = colorAt(i, n), isW = w && w.id === id;
    h += `<div class="rung ${isW ? 'work' : ''}" data-rid="${id}" style="--c:${c}"><button class="n" data-act="pos" data-id="${id}" aria-label="Cambia posizione" style="border:0;background:none;font:inherit;cursor:pointer;padding:0">${i + 1}</button><div class="t">${esc(x.t)}${isW ? '<div class="badge" style="margin-top:4px;background:rgba(232,240,58,.2);color:#E8F03A">Lavoro qui</div>' : ''}</div>
      ${isW ? '' : `<button class="btn small sec" data-act="focus" data-id="${id}">Lavora qui</button>`}
      <div class="mv"><button data-act="up" data-id="${id}" aria-label="Su">▲</button><button data-act="dn" data-id="${id}" aria-label="Giù">▼</button></div></div>`;

let dragOn = false;
app.addEventListener('touchmove', e => { if (dragOn && e.cancelable) e.preventDefault(); }, { passive: false });
function initDrag() {
  document.querySelectorAll('.rung[data-rid]').forEach(el => {
    let swallow = 0, timer = null, sx = 0, sy = 0, pid = null, grabY = 0, list = null, raf = 0, py = 0;
    const cleanup = () => { clearTimeout(timer); timer = null; cancelAnimationFrame(raf); };
    const place = () => {
      el.style.transform = ''; const r = el.getBoundingClientRect();
      el.style.transform = 'translateY(' + (py - grabY - r.top) + 'px) scale(1.02)';
    };
    const step = () => {
      if (!dragOn) return;
      const H = window.innerHeight; if (py < 90) window.scrollBy(0, -12); else if (py > H - 130) window.scrollBy(0, 12);
      const sibs = Array.from(list.querySelectorAll('.rung[data-rid]')).filter(x => x !== el);
      let before = null;
      for (const x of sibs) { const r = x.getBoundingClientRect(); if (py < r.top + r.height / 2) { before = x; break; } }
      const cur = el.nextElementSibling, want = before;
      if (want ? cur !== want : (cur && cur.matches('.rung[data-rid]'))) { if (want) want.parentNode.insertBefore(el, want); else { const last = sibs[sibs.length - 1]; if (last) last.after(el); } }
      place(); raf = requestAnimationFrame(step);
    };
    const start = () => {
      dragOn = true; document.body.classList.add('dragging'); el.classList.add('drag'); list = el.parentNode;
      const r = el.getBoundingClientRect(); grabY = sy - r.top; py = sy;
      try { el.setPointerCapture(pid); } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(18);
      raf = requestAnimationFrame(step);
    };
    el.addEventListener('contextmenu', e => e.preventDefault());
    el.addEventListener('pointerdown', e => {
      if (e.button > 0 || e.target.closest('input')) return;
      sx = e.clientX; sy = e.clientY; pid = e.pointerId; cleanup(); timer = setTimeout(start, 380);
    });
    el.addEventListener('pointermove', e => {
      if (dragOn) { py = e.clientY; return; }
      if (timer && (Math.abs(e.clientX - sx) > 9 || Math.abs(e.clientY - sy) > 9)) cleanup();
    });
    const end = () => {
      cleanup();
      if (!dragOn) return; swallow = Date.now() + 500; dragOn = false; document.body.classList.remove('dragging');
      const ids = Array.from(list.querySelectorAll('.rung[data-rid]')).map(x => x.dataset.rid);
      el.classList.remove('drag'); el.style.transform = '';
      if (ids.length === S.order.length && ids.join() !== S.order.join()) { S.order = ids; save(); toast('Spostata in posizione ' + (ids.indexOf(el.dataset.rid) + 1)); }
      window._keepY = window.scrollY; route();
    };
    el.addEventListener('click', e => { if (Date.now() < swallow) { e.stopPropagation(); e.preventDefault(); } }, true);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { if (dragOn) end(); else cleanup(); });
  });
}

    <div class="row" style="justify-content:center;margin-top:12px"><a class="btn" href="#/scala" data-act="fin">Vai alla scala</a>${rd ? '<button class="btn sky" data-act="supfin">Segna superata ✓</button>' : ''}</div>`;
  }
  h += '</div>';
  set(h);
  if (timed) tick();
}
view.storico = function () {
  const w = working(), ss = S.sessions;
  let h = '<h1>Storico</h1>';
  const days = new Set(ss.map(s => dk(new Date(s.ts))).concat(S.tas.map(s => dk(new Date(s.ts)))));
  h += `<div class="row"><div class="card" style="flex:1;text-align:center"><div style="font-size:1.8rem;font-weight:900">${ss.length}</div><small class="mut">esercizi A</small></div><div class="card" style="flex:1;text-align:center"><div style="font-size:1.8rem;font-weight:900">${S.tas.length}</div><small class="mut">training</small></div><div class="card" style="flex:1;text-align:center"><div style="font-size:1.8rem;font-weight:900">${doneList().length}</div><small class="mut">superate</small></div></div>`;
  if (S.vis.length || S.auto.length || S.tas.length) {
    h += '<h2>Corso base</h2><div class="card">' + (S.vis.length >= 2 ? '<b>Nitidezza delle visualizzazioni (1–5)</b>' + chart5(S.vis.map(x => x.avg)) : '') + (S.auto.length ? '<p><b>Autovalutazioni:</b> ' + S.auto.map(x => fdate(x.ts) + ' ' + x.pct + '%').join(' · ') + '</p>' : '') + `<p class="mut">Training: ${S.tas.length} sessioni · Visualizzazione: ${S.vis.length} sessioni</p></div>`;
  }
  if (w) {
    const mine = sessionsOf(w.id);
    h += '<h2>Situazione attuale</h2><div class="card"><b>' + esc(w.t) + '</b>' + (mine.length >= 2 ? chart([{ n: 'Picco', c: '#F87171', v: mine.map(s => Math.max.apply(null, s.cycles.map(c => c.peak))) }, { n: 'Fine', c: '#5EEAD4', v: mine.map(s => s.post) }]) + '<p class="mut">Agitazione 0–10 per esercizio. Obiettivo: le linee scendono.</p>' : '<p class="mut">Servono almeno 2 esercizi per il grafico.</p>') + '</div>';
  }
  if (S.tests.length) h += '<h2>Prove in partita</h2>' + S.tests.slice().reverse().slice(0, 8).map(t => { const x = byId(t.sit); return `<div class="card"><div class="row spread"><b>${fdate(t.ts)}</b><span class="badge ${t.calma >= 7 ? 'ok' : ''}">calma ${t.calma}/10</span></div><div class="mut">${esc(x ? x.t : 'Situazione')}${t.resp ? ' · respiro regolare' : ''}</div>${t.note ? '<div>' + esc(t.note) + '</div>' : ''}</div>`; }).join('');
  if (ss.length) h += '<h2>Ultimi esercizi</h2>' + ss.slice().reverse().slice(0, 10).map(s => { const x = byId(s.sit); return `<div class="card"><div class="row spread"><b>${fdate(s.ts)}</b><span class="mut">livello ${s.level} · ${Math.round(s.secs / 60)} min</span></div><div>${esc(x ? x.t : 'Situazione')}</div><div class="mut">Prima ${s.pre}/10 · picchi ${s.cycles.map(c => c.peak + (c.exit ? '↩' : '')).join(', ')} · fine ${s.post}/10</div></div>`; }).join('');
  else h += '<p class="mut">Ancora nessun esercizio. Inizia dalla scheda Esercizio.</p>';
  set(h);
};
function chart5(v) {
  const W = 320, H = 110, L = 22, B = 12, n = v.length, x = i => L + (W - L - 8) * i / Math.max(1, n - 1), y = t => 8 + (H - B - 8) * (1 - (t - 1) / 4);
  let g = ''; [1, 3, 5].forEach(t => { g += `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.12)"/><text x="6" y="${y(t) + 3}">${t}</text>`; });
  g += `<polyline fill="none" stroke="#5EEAD4" stroke-width="2.5" points="${v.map((t, i) => x(i) + ',' + y(t)).join(' ')}"/>` + v.map((t, i) => `<circle cx="${x(i)}" cy="${y(t)}" r="3" fill="#5EEAD4"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function chart(series) {
  const W = 320, H = 130, L = 22, B = 16, n = Math.max.apply(null, series.map(s => s.v.length));
  const x = i => L + (n <= 1 ? 0 : (W - L - 8) * i / (n - 1)), y = v => 8 + (H - B - 8) * (1 - v / 10);
  let g = '';[0, 5, 10].forEach(t => { g += `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.12)"/><text x="2" y="${y(t) + 3}">${t}</text>`; });
  series.forEach(s => { g += `<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${s.v.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>` + s.v.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.c}"/>`).join(''); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento agitazione">${g}</svg><div class="row">${series.map(s => `<span class="badge" style="color:${s.c}">● ${s.n}</span>`).join('')}</div>`;
}
view.altro = function () {
  set(`<h1>Altro</h1>
  <div class="row" style="margin:8px 0"><a class="btn small sec" href="#/guida">Come si usa</a></div><h2>Salva e condividi</h2><div class="card"><div class="row"><button class="btn small" data-act="exp">Backup (file)</button><button class="btn small sec" data-act="csv">Esporta CSV</button><button class="btn small sec" data-act="share">Condividi riepilogo</button><a class="btn small sec" data-act="wa" href="#" target="_blank" rel="noopener">WhatsApp</a></div>
  <p class="mut" style="margin-top:8px">Il backup si condivide anche su WhatsApp o Drive dal menu che si apre. Per ripristinare scegli il file qui sotto.</p><input type="file" id="imp" accept=".json,application/json"></div>
  <h2>Promemoria</h2><div class="card"><div class="row"><span>Ogni giorno alle</span><input type="time" id="remt" value="${esc(S.rem)}" style="width:auto"></div><div style="margin-top:8px"><button class="btn small" data-act="ics">Aggiungi al calendario</button></div></div>
  <h2>Importante</h2><div class="card"><p class="mut">Questa app è un allenamento mentale per lo sport, non una terapia. Se una situazione ti provoca ansia forte o disagio che va oltre lo sport, parlane con uno psicologo dello sport o con il medico.</p></div>
  <p class="mut">Versione 4c · trascina senza saltare</p><button class="btn ghost small" data-act="reset">Azzera tutti i dati</button>`);
};

// ---------- Esportazioni ----------
function dl(name, mime, text) {
  const b = new Blob([text], { type: mime });
  try { const f = new File([b], name, { type: mime }); if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: name }).catch(() => {}); return; } } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600);
}
function summary() {
  cleanOrder(); const w = working(), dn = doneList().length, tot = dn + S.order.length, ss = S.sessions, last = ss[ss.length - 1];
  let t = 'Scala della calma - ' + dk() + '\nSuperate: ' + dn + ' su ' + tot + '\n';
  if (w) t += 'Lavoro su: ' + w.t + '\n';
  t += 'Corso: training livello ' + S.level + ', visualizzazione livello ' + curV() + (lastAuto() ? ', autovalutazione ' + lastAuto().pct + '%' : '') + '\n';
  t += 'Esercizi A: ' + ss.length + ' · Training: ' + S.tas.length + ' · Prove in partita: ' + S.tests.length;
  if (last) t += '\nUltimo esercizio: picco ' + Math.max.apply(null, last.cycles.map(c => c.peak)) + '/10, fine ' + last.post + '/10';
  return t;
}
function csv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['tipo', 'data', 'situazione', 'livello', 'pre', 'picchi', 'uscite', 'fine', 'respiro', 'minuti', 'nota']];
  S.sessions.forEach(s => { const x = byId(s.sit); rows.push(['esercizio', dk(new Date(s.ts)), x ? x.t : '', s.level, s.pre, s.cycles.map(c => c.peak).join('|'), s.cycles.filter(c => c.exit).length, s.post, s.resp ? 'si' : 'no', Math.round(s.secs / 60), s.note || '']); });
  S.tas.forEach(s => rows.push(['training', dk(new Date(s.ts)), '', s.level, '', '', '', s.rel, '', Math.round(s.secs / 60), '']));
  S.vis.forEach(s => rows.push(['visualizzazione', dk(new Date(s.ts)), '', s.level, '', '', '', s.avg.toFixed(2), '', Math.round(s.secs / 60), '']));
  S.auto.forEach(s => rows.push(['autovalutazione', dk(new Date(s.ts)), '', '', '', '', '', s.pct, '', '', '']));
  S.tests.forEach(s => { const x = byId(s.sit); rows.push(['partita', dk(new Date(s.ts)), x ? x.t : '', '', '', '', '', s.calma, s.resp ? 'si' : 'no', '', s.note || '']); });
  return rows.map(r => r.map(q).join(',')).join('\n');
}
function ics() {
  const t = (S.rem || '21:00').split(':'), d = new Date(); d.setDate(d.getDate() + 1);
  const p = n => String(n).padStart(2, '0'), ds = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + 'T' + p(+t[0]) + p(+t[1]) + '00';
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Scala della calma//IT', 'BEGIN:VEVENT', 'UID:scala-' + Date.now() + '@scala', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART:' + ds, 'DURATION:PT15M', 'RRULE:FREQ=DAILY', 'SUMMARY:Scala della calma: training e visualizzazione', 'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:Quindici minuti di esercizio', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

// ---------- Router ----------
function route(keep) {
  const name = (location.hash.replace(/^#\/?/, '') || 'scala').split('/')[0];
  if (!keep && ses && ses.view !== name) abort();
  if (!ses) document.body.classList.remove('running');
  const tab = { scala: 'scala', scelta: 'scala', test: 'scala', training: 'corso', corso: 'corso', auto: 'corso', sessione: 'sessione', storico: 'storico', altro: 'altro', guida: 'scala' }[name] || 'scala';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  (view[name] || view.scala)();
}
window.addEventListener('hashchange', () => route());

// ---------- Eventi ----------
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  const mv = (id, d) => { const i = S.order.indexOf(id), j = i + d; if (i < 0 || j < 0 || j >= S.order.length) return; const t = S.order[i]; S.order[i] = S.order[j]; S.order[j] = t; save(); window._keepY = window.scrollY; route(); };
  if (a === 'pos') { const i = S.order.indexOf(id), n = S.order.length; const r = prompt('In che posizione la metti? Da 1 (la più difficile) a ' + n, String(i + 1)); const p = parseInt(r, 10); if (!isNaN(p) && p >= 1 && p <= n && p - 1 !== i) { S.order.splice(i, 1); S.order.splice(p - 1, 0, id); save(); window._keepY = window.scrollY; route(); } }
  else if (a === 'up') mv(id, -1); else if (a === 'dn') mv(id, 1);
  else if (a === 'focus') { S.focus = id; save(); toast('Lavori su questa'); window._keepY = window.scrollY; route(); }
  else if (a === 'sup') { const w = working(); if (w && confirm('Segni questa situazione come superata?')) { w.st = 'done'; w.sup = Date.now(); S.focus = null; cleanOrder(); save(); toast('Superata! Passi alla successiva'); route(); } }
  else if (a === 'undo') { const x = byId(id); if (x) { if (S.order.length >= MAXL) { toast('La scala ha già 10 situazioni'); return; } x.st = 'on'; x.sup = null; S.order.push(x.id); save(); route(); } }
  else if (a === 'addl') { if (addSit(byId(id) ? byId(id).t : (LIB.find(l => l.id === id) || {}).t, id)) route(); }
  else if (a === 'addc') { const i = $('#cust'); if (addSit(i && i.value)) route(); }
  else if (a === 'rm') { const x = byId(id); if (x) { x.st = 'off'; cleanOrder(); save(); route(); } }
  else if (a === 'tc') { window._t.c = +v; document.querySelectorAll('[data-act=tc]').forEach(x => x.classList.toggle('on', x === b)); }
  else if (a === 'tr') { window._t.r = +v; document.querySelectorAll('[data-act=tr]').forEach(x => x.classList.toggle('on', x === b)); }
  else if (a === 'tsave') { const w = working(); if (window._t.c == null) { toast('Scegli quanto sei rimasto calmo'); return; } S.tests.push({ ts: Date.now(), sit: w.id, calma: window._t.c, resp: window._t.r === 1, note: ($('#tnote') || {}).value || '' }); save(); toast('Salvato'); location.hash = '#/scala'; }
  else if (a === 'voice') { S.voice = !S.voice; save(); route(); }
  else if (a === 'pace') { S.pace = +v; save(); route(); }
  else if (a === 'lvl') { S.level = +v; save(); toast('Livello ' + v); route(); }
  else if (a === 'ta') { abort(); ses = { mode: 'ta', view: 'corso', level: +v, phase: 'ta', t0: Date.now() }; if (!S.cstart) S.cstart = Date.now(); wakeOn(); startTimed(buildTA(+v).concat(RIPRESA), () => { ses.phase = 'tarate'; render(); }); }
  else if (a === 'tr2') { S.tas.push({ ts: Date.now(), level: ses.level, rel: +v, secs: (Date.now() - ses.t0) / 1000 }); const lv = ses.level; if (S.level === lv && taPassed(lv) && lv < 6) { S.level = lv + 1; toast('Livello superato! Passi al ' + (lv + 1)); } else toast('Salvato'); save(); abort(); route(); }
  else if (a === 'va') { abort(); ses = { mode: 'vex', view: 'corso', level: +v, phase: 'vex', t0: Date.now(), vd: {} }; if (!S.cstart) S.cstart = Date.now(); wakeOn(); startTimed(VLEV[+v - 1].steps.map(x => ({ t: x[0], s: x[1] })), () => { ses.phase = 'vq'; render(); }); }
  else if (a === 'vd') { ses.vd[b.dataset.k] = +v; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === 'vsave') { const dims = VLEV[ses.level - 1].dims, sc = {}; dims.forEach(k => sc[k] = ses.vd[k]); const av = avg(dims.map(k => ses.vd[k])), lv = ses.level; S.vis.push({ ts: Date.now(), level: lv, sc, avg: av, secs: (Date.now() - ses.t0) / 1000 }); save(); abort(); toast(visPassed(lv) ? 'Livello ' + lv + ' superato!' : 'Salvato: ' + av.toFixed(1) + '/5'); route(); }
  else if (a === 'ai') { window._a[+b.dataset.i] = +v; b.parentNode.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); }
  else if (a === 'asave') { if (window._a.some(x => x == null)) { toast('Rispondi a tutte le domande'); return; } const pct = Math.round(100 * window._a.reduce((x, y) => x + y, 0) / (4 * AUTO_Q.length)); S.auto.push({ ts: Date.now(), items: window._a.slice(), pct }); if (!S.cstart) S.cstart = Date.now(); save(); toast('Autovalutazione ' + pct + '%'); location.hash = '#/corso'; }
  else if (a === 'unlock') { S.unlocked = true; save(); toast('Percorso sbloccato'); location.hash = '#/scala'; route(); }
  else if (a === 'unlockf') { if (confirm('Il corso base non è completo. Sbloccare comunque la desensibilizzazione?')) { S.unlocked = true; save(); location.hash = '#/scala'; route(); } }
  else if (a === 'cy') { view._cfg.cycles = +v; route(); }
  else if (a === 'vs') { view._cfg.vis = +v; route(); }
  else if (a === 'ly') { const L = view._cfg.layers, i = L.indexOf(v); if (i >= 0) L.splice(i, 1); else L.push(v); route(); }
  else if (a === 'startfull') { const w = working(); abort(); const c = view._cfg; ses = { mode: 'full', view: 'sessione', sit: w.id, level: S.level, cycles: c.cycles, vis: c.vis, layers: c.layers.slice(), cyc: 0, cd: [], phase: 'pre', t0: Date.now() }; wakeOn(); render(); }
  else if (a === 'pre') { ses.pre = +v; ses.phase = 'ta'; startTimed(buildTA(ses.level), () => { ses.phase = 'check'; render(); }); }
  else if (a === 'gov') { ses.phase = 'vis'; startTimed(visSteps(byId(ses.sit), ses.layers, ses.vis), () => { ses.exit = false; ses.phase = 'vrate'; render(); }); }
  else if (a === 'breath') { ses.phase = 'breath'; startTimed(BREATH, () => { ses.phase = 'check'; render(); }); }
  else if (a === 'exit') { stopTick(); ses.q = null; ses.exit = true; ses.phase = 'vrate'; try { speechSynthesis.cancel(); } catch (e) {} render(); }
  else if (a === 'vr') { ses.cd.push({ peak: +v, exit: !!ses.exit }); ses.phase = 'back'; startTimed(backSteps(+v), () => { ses.cyc++; if (ses.cyc >= ses.cycles) ses.phase = 'end'; else ses.phase = 'check'; render(); }); }
  else if (a === 'post') { ses.post = +v; ses.phase = 'endnote'; render(); }
  else if (a === 'esave') { const r = { ts: Date.now(), sit: ses.sit, level: ses.level, pre: ses.pre, cycles: ses.cd, post: ses.post, resp: !!($('#e1') || {}).checked, note: ($('#enote') || {}).value || '', secs: (Date.now() - ses.t0) / 1000 }; S.sessions.push(r); save(); stopTick(); wakeOff(); ses.phase = 'result'; render(); }
  else if (a === 'supfin') { const x = byId(ses.sit); if (x) { x.st = 'done'; x.sup = Date.now(); S.focus = null; cleanOrder(); save(); } abort(); location.hash = '#/scala'; route(); }
  else if (a === 'fin') { abort(); }
  else if (a === 'pause') { if (!ses.paused) { ses.paused = true; ses.left = ses.tEnd - Date.now(); try { speechSynthesis.cancel(); } catch (e) {} } else { ses.paused = false; ses.tEnd = Date.now() + ses.left; } b.textContent = ses.paused ? 'Riprendi' : 'Pausa'; }
  else if (a === 'skip') { ses.tEnd = Date.now(); tick(); }
  else if (a === 'stop') { if (confirm('Chiudere l\'esercizio? Non viene salvato.')) { abort(); route(); } }
  else if (a === 'exp') dl('scala-calma-backup-' + dk() + '.json', 'application/json', JSON.stringify(S));
  else if (a === 'csv') dl('scala-calma-' + dk() + '.csv', 'text/csv', csv());
  else if (a === 'share') { const t = summary(); if (navigator.share) navigator.share({ text: t }).catch(() => {}); else { try { navigator.clipboard.writeText(t); toast('Riepilogo copiato'); } catch (x) { toast(t); } } }
  else if (a === 'wa') { b.href = 'https://wa.me/?text=' + encodeURIComponent(summary()); }
  else if (a === 'ics') { const t = $('#remt'); if (t && t.value) S.rem = t.value; save(); dl('scala-calma-promemoria.ics', 'text/calendar', ics()); }
  else if (a === 'reset') { if (confirm('Cancellare tutti i dati?')) { S = JSON.parse(JSON.stringify(DEF)); save(); route(); } }
});
app.addEventListener('change', e => {
  if (e.target.id === 'imp' && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!o || !Array.isArray(o.sit) || !Array.isArray(o.sessions)) throw 0; S = Object.assign({}, DEF, o); save(); toast('Backup ripristinato'); location.hash = '#/scala'; route(); } catch (x) { toast('File non valido'); } };
    r.readAsText(e.target.files[0]);
  } else if (e.target.id === 'remt') { S.rem = e.target.value || S.rem; save(); }
});
route();
})();
</script>
